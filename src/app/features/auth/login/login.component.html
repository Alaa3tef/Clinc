<div class="login-wrapper">
  <!-- Left Column: Hero Branding with Aesthetic Image -->
  <div class="login-hero-col">
    <div class="hero-header-brand">
      <div class="brand-logo-icon">
        <i class="pi pi-sparkles"></i>
      </div>
      <h2>{{ 'BRAND.NAME' | trans }}</h2>
      <span>{{ 'BRAND.SUBTITLE' | trans }}</span>
    </div>

    <div class="hero-center-message">
      <h1>{{ 'BRAND.SLOGAN' | trans }}</h1>
      <p>{{ 'BRAND.DESCRIPTION' | trans }}</p>
    </div>

    <!-- Aesthetic Model Face Image Background Overlay -->
    <div class="hero-image-visual">
      <img
        src="https://images.unsplash.com/photo-1512290900672-1f5be634354a?w=800&auto=format&fit=crop&q=80"
        alt="Lumière Clinic Aesthetic Treatment"
      />
      <div class="hero-glass-overlay"></div>
    </div>
  </div>

  <!-- Right Column: Login Card -->
  <div class="login-form-col">
    <!-- Language Toggle (EN | AR) -->
    <div class="top-lang-switch">
      <button class="lang-btn" (click)="trans.toggleLanguage()">
        <i class="pi pi-globe"></i>
        <span>{{ trans.currentLang() === 'ar' ? 'English' : 'العربية' }}</span>
      </button>
    </div>

    <div class="login-card-content">
      <div class="login-card-header">
        <h2>{{ 'AUTH.WELCOME_BACK' | trans }}</h2>
        <p>{{ 'AUTH.SIGN_IN_SUBTITLE' | trans }}</p>
      </div>

      <form (ngSubmit)="onLogin()" class="login-form">
        <div class="form-group">
          <label>{{ 'AUTH.EMAIL_OR_PHONE' | trans }}</label>
          <div class="input-with-icon">
            <i class="pi pi-envelope"></i>
            <input
              type="text"
              name="email"
              [(ngModel)]="emailOrPhone"
              [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | trans"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>{{ 'AUTH.PASSWORD' | trans }}</label>
          <div class="input-with-icon">
            <i class="pi pi-lock"></i>
            <input
              type="password"
              name="password"
              [(ngModel)]="password"
              [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | trans"
              required
            />
          </div>
        </div>

        <div class="form-extras">
          <label class="remember-box">
            <input type="checkbox" name="remember" [(ngModel)]="rememberMe" />
            <span>{{ 'AUTH.REMEMBER_ME' | trans }}</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link">{{ 'AUTH.FORGOT_PASSWORD' | trans }}</a>
        </div>

        @if (loginError()) {
          <p class="login-error" role="alert">{{ 'AUTH.LOGIN_ERROR' | trans }}</p>
        }

        <button type="submit" class="btn-primary submit-login-btn" [disabled]="isSubmitting()">
          <span>{{ 'AUTH.LOGIN_BTN' | trans }}</span>
          <i class="pi pi-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>
</div>
